services:
  - type: web
    name: rag-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: QDRANT_PATH
        value: /data/qdrant

  - type: web
    name: rag-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: API_URL
        fromService:
          name: rag-backend
          type: web
          property: host
